version: '3.8'

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - dashboard
      - app
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: ../infra/server.Dockerfile
    volumes:
      - vibes_data:/app/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/sqlite.db
      - MAX_UPLOAD_MB=1024
      - CORS_ORIGIN=*
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../infra/dashboard.Dockerfile
    depends_on:
      - server
    restart: unless-stopped

  app:
    build:
      context: ../app
      dockerfile: ../infra/app.Dockerfile
    depends_on:
      - server
    restart: unless-stopped

volumes:
  vibes_data:
    driver: local
