<ng-container *ngIf="auth.user$ | async as user; else unauthenticated">
  <div class="flex h-screen w-full bg-background overflow-hidden text-foreground">
    
    <!-- Sidebar -->
    <aside 
      class="fixed inset-y-0 left-0 z-40 w-64 transform border-r bg-card transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
      [class.-translate-x-full]="!(isSidebarOpen || ((isHandset$ | async) === false))">
      
      <div class="flex h-16 items-center border-b px-6">
        <ng-icon hlm name="lucideClapperboard" class="mr-3 h-6 w-6 text-primary"></ng-icon>
        <div class="flex flex-col">
          <span class="text-lg font-bold leading-tight">Reels Library</span>
          <span class="text-xs text-muted-foreground">Private Media Server</span>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-4">
        <ul class="space-y-1 px-3">
          <li>
            <a routerLink="/dashboard" routerLinkActive="bg-accent text-accent-foreground" [routerLinkActiveOptions]="{exact: true}" 
               class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors">
              <ng-icon hlm name="lucideLayoutDashboard" class="mr-3 h-4 w-4"></ng-icon>
              Videos
            </a>
          </li>
          <li>
            <a routerLink="/dashboard/categories" routerLinkActive="bg-accent text-accent-foreground" 
               class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors">
              <ng-icon hlm name="lucideFolder" class="mr-3 h-4 w-4"></ng-icon>
              Categories
            </a>
          </li>
          <li>
            <a routerLink="/dashboard/tags" routerLinkActive="bg-accent text-accent-foreground" 
               class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors">
              <ng-icon hlm name="lucideTag" class="mr-3 h-4 w-4"></ng-icon>
              Tags
            </a>
          </li>
          <li *ngIf="user.role === 'admin'">
            <a routerLink="/dashboard/users" routerLinkActive="bg-accent text-accent-foreground" 
               class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors">
              <ng-icon hlm name="lucideUsers" class="mr-3 h-4 w-4"></ng-icon>
              Users
            </a>
          </li>
          <li *ngIf="user.role === 'admin'">
            <a routerLink="/dashboard/analytics" routerLinkActive="bg-accent text-accent-foreground" 
               class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-accent hover:text-accent-foreground transition-colors">
              <ng-icon hlm name="lucideBarChart" class="mr-3 h-4 w-4"></ng-icon>
              Analytics
            </a>
          </li>
        </ul>
      </nav>

      <div class="border-t p-4">
        <div class="mb-4 flex flex-col">
          <span class="text-sm font-medium truncate">{{ user.email }}</span>
          <span class="text-xs uppercase text-muted-foreground mt-1">{{ user.role }}</span>
        </div>
        <button hlmBtn variant="destructive" class="w-full justify-start" (click)="logout()">
          <ng-icon hlm name="lucideLogOut" class="mr-2 h-4 w-4"></ng-icon> Logout
        </button>
      </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div 
      *ngIf="isSidebarOpen && (isHandset$ | async)" 
      class="fixed inset-0 z-30 bg-background/80 backdrop-blur-sm transition-all duration-100"
      (click)="toggleSidebar()">
    </div>

    <!-- Main Content -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <header class="flex h-16 items-center justify-between border-b bg-card px-6">
        <button 
          *ngIf="isHandset$ | async"
          hlmBtn variant="ghost" size="icon"
          (click)="toggleSidebar()" 
          aria-label="Toggle sidenav">
          <ng-icon hlm name="lucideMenu" class="h-5 w-5"></ng-icon>
        </button>
        <div class="ml-auto flex items-center space-x-4">
          <button hlmBtn variant="ghost" [hlmDropdownMenuTrigger]="userMenu" class="flex items-center gap-2">
            <ng-icon hlm name="lucideUserCircle" class="h-5 w-5"></ng-icon>
            <span class="hidden md:inline">{{ user.email }}</span>
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 bg-muted/20">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <ng-template #userMenu>
    <hlm-dropdown-menu>
      <button hlmDropdownMenuItem (click)="logout()">
        <ng-icon hlm name="lucideLogOut" class="mr-2 h-4 w-4"></ng-icon>
        <span>Logout</span>
      </button>
      <button hlmDropdownMenuItem (click)="logoutAll()">
        <ng-icon hlm name="lucideMonitorSmartphone" class="mr-2 h-4 w-4"></ng-icon>
        <span>Logout All Devices</span>
      </button>
    </hlm-dropdown-menu>
  </ng-template>
</ng-container>

<ng-template #unauthenticated>
  <main class="flex min-h-screen items-center justify-center bg-muted/20 p-4">
    <router-outlet></router-outlet>
  </main>
</ng-template>
